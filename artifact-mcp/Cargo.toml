[package]
name = "yijie-artifact-mcp"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
rmcp = { version = "=1.8.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["io-util", "io-std", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "=2.6.1"

[profile.dev]
debug = 0
