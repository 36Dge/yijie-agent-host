{
  "openapi": "3.0.3",
  "info": {
    "title": "Yijie native turn timing",
    "version": "0.1.0",
    "description": "FEAT-155 independent local candidate; additive read-only stable Runtime projection. Does not change native history v1/v2 or SSE v7/v8. Host does not persist timing or reconstruct lifecycle."
  },
  "servers": [
    {
      "url": "http://127.0.0.1:18080"
    }
  ],
  "security": [
    {
      "LocalBearer": []
    }
  ],
  "paths": {
    "/v1/agent-sessions/{agent_session_id}/turns/{runtime_turn_id}/timing": {
      "get": {
        "operationId": "readNativeTurnTiming",
        "summary": "Read timing facts for one exactly bound native turn",
        "description": "No body or query. At most 1024 turns and 8 MiB decoded history, bounded by the existing 16 MiB RPC transport and a 3 second deadline. No start, resume, submission, approval or Store write. Historical missing values are unknown.",
        "parameters": [
          {
            "name": "agent_session_id",
            "in": "path",
            "required": true,
            "schema": {
              "$ref": "#/components/schemas/CanonicalID"
            }
          },
          {
            "name": "runtime_turn_id",
            "in": "path",
            "required": true,
            "schema": {
              "$ref": "#/components/schemas/CanonicalID"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Exact native turn clock only; no execution or lifecycle authority.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/NativeTurnTiming"
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                },
                "description": "Never cache timing transport responses."
              }
            }
          },
          "400": {
            "description": "Invalid IDs or unexpected query/body",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/TimingError"
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                },
                "description": "Never cache timing transport responses."
              }
            }
          },
          "401": {
            "description": "Owner-only bearer required",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/TimingError"
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                },
                "description": "Never cache timing transport responses."
              }
            }
          },
          "404": {
            "description": "Current session or exact turn not found; no inference about prior execution",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/TimingError"
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                },
                "description": "Never cache timing transport responses."
              }
            }
          },
          "503": {
            "description": "Native history unavailable, timeout, mismatch or bounded read limit",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/TimingError"
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                },
                "description": "Never cache timing transport responses."
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "LocalBearer": {
        "type": "http",
        "scheme": "bearer",
        "description": "Existing owner-only loopback token; no new public auth."
      }
    },
    "schemas": {
      "CanonicalID": {
        "type": "string",
        "format": "uuid",
        "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        "description": "Canonical non-zero UUID; identity is checked against the managed mapping.",
        "not": {
          "enum": [
            "00000000-0000-0000-0000-000000000000"
          ]
        }
      },
      "TimeFieldState": {
        "type": "string",
        "enum": [
          "known",
          "unknown",
          "invalid"
        ]
      },
      "UnixSecondsFact": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "state"
        ],
        "properties": {
          "state": {
            "$ref": "#/components/schemas/TimeFieldState"
          },
          "value": {
            "type": "integer",
            "format": "int64",
            "minimum": -8640000000000,
            "maximum": 8640000000000
          }
        },
        "description": "Runtime Unix seconds, not local receipt/schedule time. Omitted/null native field is unknown; malformed or out-of-range is invalid. Zero is valid.",
        "x-state-rules": {
          "field": "state",
          "rules": {
            "known": {
              "required": [
                "value"
              ]
            },
            "unknown": {
              "forbidden": [
                "value"
              ]
            },
            "invalid": {
              "forbidden": [
                "value"
              ]
            }
          }
        }
      },
      "DurationMsFact": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "state"
        ],
        "properties": {
          "state": {
            "$ref": "#/components/schemas/TimeFieldState"
          },
          "value": {
            "type": "integer",
            "format": "int64",
            "minimum": 0,
            "maximum": 9007199254740991
          }
        },
        "description": "Runtime whole-turn elapsed milliseconds, including its waits. Not item/model-only time and not derived from integer seconds.",
        "x-state-rules": {
          "field": "state",
          "rules": {
            "known": {
              "required": [
                "value"
              ]
            },
            "unknown": {
              "forbidden": [
                "value"
              ]
            },
            "invalid": {
              "forbidden": [
                "value"
              ]
            }
          }
        }
      },
      "TimingSource": {
        "type": "string",
        "enum": [
          "runtime_read"
        ]
      },
      "NativeTurnTiming": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "schema_version",
          "agent_session_id",
          "thread_id",
          "turn_id",
          "source",
          "started_at",
          "completed_at",
          "duration_ms"
        ],
        "properties": {
          "schema_version": {
            "type": "integer",
            "enum": [
              1
            ]
          },
          "agent_session_id": {
            "$ref": "#/components/schemas/CanonicalID"
          },
          "thread_id": {
            "$ref": "#/components/schemas/CanonicalID"
          },
          "turn_id": {
            "$ref": "#/components/schemas/CanonicalID"
          },
          "source": {
            "$ref": "#/components/schemas/TimingSource"
          },
          "started_at": {
            "$ref": "#/components/schemas/UnixSecondsFact"
          },
          "completed_at": {
            "$ref": "#/components/schemas/UnixSecondsFact"
          },
          "duration_ms": {
            "$ref": "#/components/schemas/DurationMsFact"
          }
        }
      },
      "TimingErrorCode": {
        "type": "string",
        "enum": [
          "invalid_request",
          "unauthorized",
          "session_not_found",
          "turn_not_found",
          "native_timing_unavailable",
          "native_timing_timeout",
          "native_timing_identity_mismatch",
          "native_timing_limit_exceeded"
        ]
      },
      "TimingError": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "code",
              "message"
            ],
            "properties": {
              "code": {
                "$ref": "#/components/schemas/TimingErrorCode"
              },
              "message": {
                "type": "string",
                "minLength": 1,
                "maxLength": 160
              }
            }
          }
        }
      }
    }
  }
}
