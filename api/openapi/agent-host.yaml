  /v3/agent-sessions/{agent_session_id}/artifacts/{artifact_id}/ack:
    parameters:
      - $ref: "#/components/parameters/AgentSessionId"
      - $ref: "#/components/parameters/ArtifactId"
    post:
      operationId: acknowledgeAgentArtifactV3
      summary: Acknowledge a verified Desktop-local artifact commit
      description: |
        Desktop native calls this only after an atomic local commit has verified
        the completed event's size and SHA-256. The canonical request is
        idempotent by `ack_id`: replaying the same request returns the original
        acknowledgement, while reuse with different canonical input returns
        `409 artifact_ack_conflict`. Acknowledgement authorizes early staging
        cleanup; cleanup is also allowed on Host restart or after the staging TTL.
      tags: [Artifacts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactAcknowledgementV3Request"
      responses:
        "200":
          description: The canonical acknowledgement is recorded; staging cleanup is pending or completed.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactAcknowledgementV3Response"
        "400":
          $ref: "#/components/responses/ArtifactBadRequest"
        "401":
          $ref: "#/components/responses/ArtifactUnauthorized"
        "404":
          $ref: "#/components/responses/ArtifactNotFound"
        "409":
          description: "`artifact_ack_conflict`, `artifact_not_ready`, or `artifact_manifest_mismatch`: the acknowledgement cannot be applied safely."
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactErrorResponseV3"
        "410":
          $ref: "#/components/responses/ArtifactExpired"
        "500":
          $ref: "#/components/responses/ArtifactInternalError"
  /v1/skills:
    get:
      operationId: listManagedSkills
      summary: List the bundled catalog and current managed Skill state
      description: |
        Returns a content-free projection of the bundled and catalog-only
        entries, the managed
        installation directory, and the current Runtime visibility state. It
        never returns an archive path, App Data path, SKILL.md content, token, or
        arbitrary filesystem metadata. Unknown Runtime Skills outside the
        Desktop-managed root are not included.

        `plugin.read` is required in addition to the owner-only local bearer.
        The capability is an allow-only local profile decision and is never
        inferred from possession of the bearer token.
      tags: [Skills]
      x-yijie-required-capability: plugin.read
      responses:
        "200":
          description: Current bounded Skill catalog and state projection.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillListResponse"
        "401":
          $ref: "#/components/responses/SkillUnauthorized"
        "403":
          $ref: "#/components/responses/SkillForbidden"
        "500":
          $ref: "#/components/responses/SkillInternalError"
        "503":
          $ref: "#/components/responses/SkillUnavailable"
  /v1/skills/scan-operations:
    post:
      operationId: scanManagedSkills
      summary: Reconcile the managed Skill directory with the bundled catalog
      description: |
        Performs an idempotent bounded scan of the preconfigured Desktop-managed
        Skill root. The request accepts no path. Host canonicalizes its configured
        root, ignores unknown directories, rejects invalid receipts, stops
        projecting missing or corrupt Skills, and refreshes Runtime state through
        the pinned Skills API. The same `operation_id` and reason may return the
        completed result; reuse with different canonical input is a conflict.
      tags: [Skills]
      x-yijie-required-capability: plugin.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillScanRequest"
      responses:
        "200":
          description: Scan completed and the response reflects the converged managed state.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillScanResponse"
        "400":
          $ref: "#/components/responses/SkillBadRequest"
        "401":
          $ref: "#/components/responses/SkillUnauthorized"
        "403":
          $ref: "#/components/responses/SkillForbidden"
        "409":
          $ref: "#/components/responses/SkillConflict"
        "500":
          $ref: "#/components/responses/SkillInternalError"
        "503":
          $ref: "#/components/responses/SkillUnavailable"
  /v1/skills/{skill_id}/install-operations:
    parameters:
      - $ref: "#/components/parameters/SkillId"
    post:
      operationId: installManagedSkill
      summary: Install one catalog Skill from the preconfigured bundled resource root
      description: |
        Installs only the exact catalog entry named by `skill_id`. Desktop binds
        the request to its catalog view with the expected version, archive digest,
        and catalog revision; it never supplies an archive or destination path.
        A `catalog-only` entry has no archive and must be rejected as
        `skill_not_installable` before any digest or archive access. For a
        bundled entry, Host must require a manifest entry whose provenance and redistribution
        reviews are verified and whose catalog status is `installable`, validate
        SHA-256, file count, expanded size, relative ZIP entries, regular-file
        types, and the required SKILL.md, then commit through a same-volume staging
        directory and atomic rename. A failure leaves no registered partial copy
        and preserves any previously usable version. Successful first install is
        enabled by default and becomes visible from the next Runtime Skill snapshot.

        The same canonical request and `operation_id` is idempotent. Reuse with
        different input returns `skill_operation_conflict`.
      tags: [Skills]
      x-yijie-required-capability: plugin.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillInstallRequest"
      responses:
        "200":
          description: Installation and Runtime projection completed.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillMutationResponse"
        "400":
          $ref: "#/components/responses/SkillBadRequest"
        "401":
          $ref: "#/components/responses/SkillUnauthorized"
        "403":
          $ref: "#/components/responses/SkillForbidden"
        "404":
          $ref: "#/components/responses/SkillNotFound"
        "409":
          $ref: "#/components/responses/SkillConflict"
        "422":
          $ref: "#/components/responses/SkillUnprocessable"
        "500":
          $ref: "#/components/responses/SkillInternalError"
        "503":
          $ref: "#/components/responses/SkillUnavailable"
  /v1/skills/{skill_id}/enabled:
    parameters:
      - $ref: "#/components/parameters/SkillId"
    put:
      operationId: setManagedSkillEnabled
      summary: Enable or disable one installed Skill
      description: |
        Persists the desired enabled state in the Desktop-managed root and maps
        the exact canonical SKILL.md to Runtime `skills/config/write`. Disabling
        keeps files installed but removes the Skill from the next model-visible
        snapshot; enabling restores visibility from the next snapshot. The state
        must be replayable after Desktop, Host, or Runtime restart. The request
        contains no path and cannot target a Skill outside the managed catalog.
        The same canonical enabled value and `operation_id` is idempotent; reuse
        with a different value returns `skill_operation_conflict`.
      tags: [Skills]
      x-yijie-required-capability: plugin.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillEnabledRequest"
      responses:
        "200":
          description: Enabled state and Runtime projection converged.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillMutationResponse"
        "400":
          $ref: "#/components/responses/SkillBadRequest"
        "401":
          $ref: "#/components/responses/SkillUnauthorized"
        "403":
          $ref: "#/components/responses/SkillForbidden"
        "404":
          $ref: "#/components/responses/SkillNotFound"
        "409":
          $ref: "#/components/responses/SkillConflict"
        "500":
          $ref: "#/components/responses/SkillInternalError"
        "503":
          $ref: "#/components/responses/SkillUnavailable"
  /v1/skills/{skill_id}/uninstall-operations:
    parameters:
      - $ref: "#/components/parameters/SkillId"
    post:
      operationId: uninstallManagedSkill
      summary: Uninstall one managed Skill copy
      description: |
        Stops Runtime projection, then removes only the exact canonical managed
        installation directory and its receipt/disabled marker. It never deletes
        the bundled read-only archive, source repository, arbitrary symlink target,
        or path supplied by Desktop. The same canonical request and `operation_id`
        is idempotent; a missing installation returns the converged not-installed
        result while an unknown catalog ID remains `skill_not_found`.
      tags: [Skills]
      x-yijie-required-capability: plugin.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillUninstallRequest"
      responses:
        "200":
          description: The managed copy is absent and no longer projected to Runtime.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillMutationResponse"
        "400":
          $ref: "#/components/responses/SkillBadRequest"
        "401":
          $ref: "#/components/responses/SkillUnauthorized"
        "403":
          $ref: "#/components/responses/SkillForbidden"
        "404":
          $ref: "#/components/responses/SkillNotFound"
        "409":
          $ref: "#/components/responses/SkillConflict"
        "500":
          $ref: "#/components/responses/SkillInternalError"
        "503":
          $ref: "#/components/responses/SkillUnavailable"
components:
  securitySchemes:
    localBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque owner-only local token
      description: |
        Agent Host generates a 256-bit opaque token in
        `$YIJIE_AGENT_HOST_HOME/api-token`, protected from group/other access.
        Only the same-user Desktop/local client may read it. Never place this
        token in a URL, log, browser storage, persisted task payload, or example.
        The current Host requires the exact ASCII authorization prefix `Bearer `.
  parameters:
    TaskId:
      name: task_id
      in: path
      required: true
      description: Control-plane task identifier. One Agent session may be reserved per task.
      schema:
        type: string
        format: uuid
    AgentSessionId:
      name: agent_session_id
      in: path
      required: true
      description: Agent Host-generated session identifier.
      schema:
        type: string
        format: uuid
    ArtifactId:
      name: artifact_id
      in: path
      required: true
      description: Host-generated structured-artifact identifier scoped to the Agent session.
      schema:
        type: string
        format: uuid
    SkillId:
      name: skill_id
      in: path
      required: true
      description: Stable catalog identifier. It is resolved through the signed-in bundle manifest and is never interpreted as a path.
      schema:
        type: string
        minLength: 3
        maxLength: 128
        pattern: "^[a-z][a-z0-9]*(?:[.-][a-z0-9]+)*$"
    TurnId:
      name: turn_id
      in: path
      required: true
      description: Codex Runtime-generated turn identifier.
      schema:
        type: string
        format: uuid
    EventStreamId:
      name: stream_id
      in: query
      required: false
      description: |
        Expected process-local stream identifier. Required when `after > 0`
        unless `Last-Event-ID` supplies the complete cursor. A mismatch returns
        `409 event_stream_changed`.
      schema:
        type: string
        format: uuid
    EventAfter:
      name: after
      in: query
      required: false
      description: |
        Unsigned 64-bit sequence after which events are replayed. Defaults to
        zero. Values greater than zero require a matching stream ID. Ignored when
        `Last-Event-ID` is present.
      schema:
        type: integer
        format: uint64
        minimum: 0
        maximum: 18446744073709551615
        default: 0
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: |
        Complete SSE cursor `<stream_id>:<sequence>`. Sequence is a decimal
        unsigned 64-bit integer from 1 through 18446744073709551615 with no
        leading zero. The header overrides `stream_id` and `after` query parameters.
      schema:
        type: string
        pattern: "^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}:[1-9][0-9]*$"
    EventSchemaVersionV2:
      name: event_schema_version
      in: query
      required: true
      description: Explicit negotiation guard. Only integer value 2 is accepted on the v2 event stream.
      schema:
        type: integer
        format: int32
        enum: [2]
    EventSchemaVersionV3:
      name: event_schema_version
      in: query
      required: true
      description: Explicit negotiation guard. Only integer value 3 is accepted on the v3 event stream.
      schema:
        type: integer
        format: int32
        enum: [3]
    EventSchemaVersionV4:
      name: event_schema_version
      in: query
      required: true
      description: Explicit negotiation guard. Only integer value 4 is accepted on the v4 event stream.
      schema:
        type: integer
        format: int32
        enum: [4]
    ByteRange:
      name: Range
      in: header
      required: false
      description: A single inclusive HTTP byte range. Multiple or malformed ranges are rejected.
      schema:
        type: string
        pattern: "^bytes=(0|[1-9][0-9]*)-(0|[1-9][0-9]*)?$"
  headers:
    NoStore:
      description: Prevents credentials, status, and session data from being cached.
      required: true
      schema:
        type: string
        enum: [no-store]
  responses:
    BadRequest:
      description: "`invalid_request`: request JSON or parameters are invalid."
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: invalid_request
              message: request parameters are invalid
    Unauthorized:
      description: "`unauthorized`: a valid local Agent Host bearer token is required."
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: unauthorized
              message: valid Agent Host bearer token required
    SessionNotFound:
      description: "`session_not_found`: no Agent session exists for the identifier."
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: session_not_found
              message: agent session was not found
    RuntimeRequestFailed:
      description: "`runtime_request_failed`: the managed Codex Runtime request failed. The provider's raw error is not exposed."
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: runtime_request_failed
              message: Codex Runtime request failed
    InternalError:
      description: "`internal_error`: the Agent Host operation failed without exposing an internal stack or secret."
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: internal_error
              message: Agent Host operation failed
    SkillBadRequest:
      description: "`invalid_request`: the operation ID, Skill ID, version, digest, catalog revision, or closed request body is invalid."
      x-yijie-error-codes: [invalid_request]
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SkillErrorResponse"
    SkillUnauthorized:
      description: "`unauthorized`: a valid owner-only local Agent Host bearer token is required."
      x-yijie-error-codes: [unauthorized]
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SkillErrorResponse"
    SkillForbidden:
      description: "`capability_denied`: the exact local identity does not have the operation's declared plugin capability."
      x-yijie-error-codes: [capability_denied]
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SkillErrorResponse"
    SkillNotFound:
      description: "`skill_not_found`: the stable Skill ID is absent from the loaded bundle catalog."
      x-yijie-error-codes: [skill_not_found]
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SkillErrorResponse"
    SkillConflict:
      description: "`skill_operation_conflict` or `skill_busy`: the idempotency key was reused with different input or another mutation is active."
      x-yijie-error-codes: [skill_operation_conflict, skill_busy]
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SkillErrorResponse"
    SkillUnprocessable:
      description: |
        The catalog item cannot be installed safely: `skill_not_installable`
        (including every catalog-only or blocked entry),
        `bundle_missing`, `bundle_manifest_invalid`, `archive_checksum_mismatch`,
        `archive_unsafe`, or `archive_too_large`.
      x-yijie-error-codes:
        - skill_not_installable
        - bundle_missing
        - bundle_manifest_invalid
        - archive_checksum_mismatch
        - archive_unsafe
        - archive_too_large
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SkillErrorResponse"
    SkillUnavailable:
      description: "`runtime_unavailable` or `runtime_sync_failed`: Runtime projection cannot currently converge."
      x-yijie-error-codes: [runtime_unavailable, runtime_sync_failed]
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Retry-After:
          description: Optional bounded delay before retrying the same idempotent operation.
          schema:
            type: integer
            minimum: 1
            maximum: 60
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SkillErrorResponse"
    SkillInternalError:
      description: "`install_failed`, `uninstall_failed`, `scan_failed`, or `internal_error` without any local path or archive content."
      x-yijie-error-codes: [install_failed, uninstall_failed, scan_failed, internal_error]
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SkillErrorResponse"
    TitleOperationConflict:
      description: "`title_operation_conflict`: the operation ID was already used with different canonical input."
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TitleOperationConflictError"
    TitleOutputInvalid:
      description: "`title_output_invalid`: provider output failed the strict object or plain-title validator."
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TitleOutputInvalidError"
    TitleGenerationUnavailable:
      description: "`title_generation_unavailable`: the isolated title operation did not produce a known valid result."
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Retry-After:
          description: Optional bounded delay in seconds before a controlled retry of the same operation.
          schema:
            type: integer
            minimum: 1
            maximum: 60
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TitleGenerationUnavailableError"
    ArtifactBytes:
      description: Verified complete artifact or poster bytes. HEAD returns these headers without a body.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Content-Length:
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 67108864
        ETag:
          required: true
          description: Quoted lowercase SHA-256 of the exact returned resource.
          schema:
            type: string
            pattern: '^"[a-f0-9]{64}"$'
        Accept-Ranges:
          required: true
          schema:
            type: string
            enum: [bytes]
        Content-Disposition:
          required: true
          description: Safe attachment or inline disposition with a sanitized filename; no path components.
          schema:
            type: string
            minLength: 1
        X-Content-Type-Options:
          required: true
          schema:
            type: string
            enum: [nosniff]
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    ArtifactPartialBytes:
      description: A verified single byte range from an artifact or poster.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Content-Length:
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 67108864
        Content-Range:
          required: true
          schema:
            type: string
            pattern: "^bytes (0|[1-9][0-9]*)-(0|[1-9][0-9]*)/(0|[1-9][0-9]*)$"
        ETag:
          required: true
          schema:
            type: string
            pattern: '^"[a-f0-9]{64}"$'
        Accept-Ranges:
          required: true
          schema:
            type: string
            enum: [bytes]
        Content-Disposition:
          required: true
          schema:
            type: string
            minLength: 1
        X-Content-Type-Options:
          required: true
          schema:
            type: string
            enum: [nosniff]
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    ArtifactBadRequest:
      description: "`invalid_request` or `invalid_range`: path, body, or range input is invalid."
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ArtifactErrorResponseV3"
    ArtifactUnauthorized:
      description: "`unauthorized`: a valid owner-only local Agent Host bearer token is required."
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ArtifactErrorResponseV3"
    ArtifactNotFound:
      description: "`artifact_not_found`: the artifact does not exist in this owner/session scope, or no poster exists."
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ArtifactErrorResponseV3"
    ArtifactExpired:
      description: "`artifact_expired`: a content-free tombstone proves that the staging resource expired or was acknowledged and cleaned."
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ArtifactErrorResponseV3"
    ArtifactRangeNotSatisfiable:
      description: "`artifact_range_not_satisfiable`: the single requested byte range is outside the verified resource."
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ArtifactErrorResponseV3"
    ArtifactInternalError:
      description: "`artifact_resource_unavailable` or `internal_error`: the resource cannot be served without exposing internal details."
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ArtifactErrorResponseV3"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [service, status]
      properties:
        service:
          type: string
          enum: [yijie-agent-host]
        status:
          type: string
          enum: [ok]
    ReadyResponse:
      type: object
      additionalProperties: false
      required: [status, runtime_state]
      properties:
        status:
          type: string
          enum: [ready]
        runtime_state:
          type: string
          enum: [ready]
    NotReadyResponse:
      type: object
      additionalProperties: false
      required: [status, runtime_state]
      properties:
        status:
          type: string
          enum: [not_ready]
        runtime_state:
          $ref: "#/components/schemas/RuntimeState"
    AgentHostStatus:
      type: object
      additionalProperties: false
      required: [service, status, environment, runtime_mode, runtime]
      properties:
        service:
          type: string
          enum: [yijie-agent-host]
        status:
          type: string
          enum: [ok, degraded]
        environment:
          type: string
          minLength: 1
        runtime_mode:
          type: string
          enum: [managed-stdio]
        runtime:
          $ref: "#/components/schemas/RuntimeStatus"
    RuntimeStatus:
      type: object
      additionalProperties: false
      required: [state, ready, transport, experimental_api]
      properties:
        state:
          $ref: "#/components/schemas/RuntimeState"
        ready:
          type: boolean
        runtime_version:
          type: string
          enum: [0.144.6]
        upstream_tag:
          type: string
          enum: [rust-v0.144.6]
        upstream_commit:
          type: string
          enum: [5d1fbf26c43abc65a203928b2e31561cb039e06d]
        transport:
          type: string
          enum: [stdio]
        experimental_api:
          type: boolean
          enum: [false]
        failure_code:
          type: string
          enum:
            - runtime_not_configured
            - runtime_config_invalid
            - provider_config_failed
            - artifact_verification_failed
            - startup_cancelled
            - runtime_start_failed
            - initialize_failed
            - initialize_response_invalid
            - initialized_notification_failed
            - runtime_exited
            - runtime_disconnected
            - protocol_failure
        model_provider:
          type: string
          enum: [minimax]
        model:
          type: string
          enum: [MiniMax-M3]
    RuntimeState:
      type: string
      enum:
        - not_configured
        - verifying
        - starting
        - initializing
        - ready
        - stopping
        - stopped
        - failed
    TraceRequest:
      type: object
      additionalProperties: false
      description: |
        Correlation metadata copied to subsequent events. `{}` is valid. These
        values are correlation context, not authentication or authorization input.
      properties:
        trace_id:
          type: string
        request_id:
          type: string
        tenant_id:
          type: string
        user_id:
          type: string
    StartSessionRequest:
      type: object
      additionalProperties: false
      required: [cwd]
      properties:
        trace_id:
          type: string
          description: Optional correlation identifier copied to session events.
        request_id:
          type: string
          description: Optional request correlation identifier copied to session events.
        tenant_id:
          type: string
          description: Optional correlation context only; it does not grant tenant access.
        user_id:
          type: string
          description: Optional correlation context only; it does not authenticate a user.
        cwd:
          type: string
          minLength: 1
          pattern: ^/
          description: |
            Existing absolute local directory. Host resolves symlinks and uses the
            resulting canonical path as the session working directory. Any private
            persistence representation is an implementation detail and is not part
            of this wire contract.
    StartTurnRequest:
      type: object
      additionalProperties: false
      required: [input]
      properties:
        trace_id:
          type: string
          description: Optional correlation identifier copied to events from this operation onward.
        request_id:
          type: string
          description: Optional request correlation identifier copied to events from this operation onward.
        tenant_id:
          type: string
          description: Optional correlation context only; it does not grant tenant access.
        user_id:
          type: string
          description: Optional correlation context only; it does not authenticate a user.
        input:
          type: string
          minLength: 1
          pattern: \S
          description: |
            Text-only turn input. It must contain a non-whitespace character and
            must not exceed 1 MiB in UTF-8 bytes. The complete JSON body is also
            capped at 1 MiB.
        reasoning_effort:
          type: string
          enum: ["", none, high]
          default: none
          description: Omit or send the empty string for `none`; clients should prefer omission, `none`, or `high`.
    StartTurnV2Request:
      type: object
      additionalProperties: false
      required: [operation_id, content_blocks]
      properties:
        operation_id:
          type: string
          format: uuid
          description: |
            Desktop-selected idempotency identifier scoped to this Agent session.
            The same canonical ordered input returns the original accepted turn;
            reuse with different input returns `turn_operation_conflict`.
        trace_id:
          type: string
          description: Optional correlation identifier copied to events from this operation onward.
        request_id:
          type: string
          description: Optional request correlation identifier copied to events from this operation onward.
        tenant_id:
          type: string
          description: Optional correlation context only; it does not grant tenant access.
        user_id:
          type: string
          description: Optional correlation context only; it does not authenticate a user.
        content_blocks:
          type: array
          minItems: 1
          maxItems: 16
          description: |
            Ordered Runtime input. Array order is message order and must be
            preserved when Host maps blocks to Runtime UserInput values. The
            request may contain at most 10 image/file blocks. Decoded image bytes
            across all image blocks must be at most 10 MiB; UTF-8 bytes across all
            file `context_chunks` must be at most 256 KiB. Those aggregate limits
            are validated semantically before Runtime invocation.
          items:
            $ref: "#/components/schemas/StartTurnV2ContentBlock"
        reasoning_effort:
          type: string
          enum: ["", none, high]
          x-enum-varnames:
            - StartTurnV2ReasoningEffortEmpty
            - StartTurnV2ReasoningEffortNone
            - StartTurnV2ReasoningEffortHigh
          default: none
          description: Omit or send the empty string for `none`; clients should prefer omission, `none`, or `high`.
    StartTurnV2ContentBlock:
      description: A closed content-block union discriminated by `type`.
      oneOf:
        - $ref: "#/components/schemas/StartTurnV2TextBlock"
        - $ref: "#/components/schemas/StartTurnV2ImageBlock"
        - $ref: "#/components/schemas/StartTurnV2FileBlock"
      discriminator:
        propertyName: type
        mapping:
          text: "#/components/schemas/StartTurnV2TextBlock"
          image: "#/components/schemas/StartTurnV2ImageBlock"
          file: "#/components/schemas/StartTurnV2FileBlock"
    StartTurnV2TextBlock:
      type: object
      additionalProperties: false
      required: [type, text]
      properties:
        type:
          type: string
          enum: [text]
          x-enum-varnames: [StartTurnV2ContentTypeText]
        text:
          type: string
          minLength: 1
          maxLength: 1048576
          pattern: \S
          x-yijie-max-utf8-bytes: 1048576
          description: Non-blank user text, bounded to 1 MiB in UTF-8 bytes.
    StartTurnV2ImageBlock:
      type: object
      additionalProperties: false
      required: [type, attachment_id, media_type, size_bytes, sha256, data_url]
      properties:
        type:
          type: string
          enum: [image]
          x-enum-varnames: [StartTurnV2ContentTypeImage]
        attachment_id:
          type: string
          format: uuid
          description: Desktop attachment identifier; correlation only, never a local path.
        media_type:
          type: string
          enum: [image/jpeg, image/png, image/webp, image/gif]
          x-enum-varnames:
            - StartTurnV2ImageMediaTypeJPEG
            - StartTurnV2ImageMediaTypePNG
            - StartTurnV2ImageMediaTypeWebP
            - StartTurnV2ImageMediaTypeGIF
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 10485760
          description: Exact decoded image byte length.
        sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: Lowercase hexadecimal SHA-256 of the decoded image bytes.
        data_url:
          type: string
          minLength: 23
          maxLength: 13981039
          pattern: "^data:image/(jpeg|png|webp|gif);base64,[A-Za-z0-9+/]+={0,2}$"
          description: |
            Canonical base64 data URL. Its header must equal `media_type`; decoded
            length must equal `size_bytes`; and decoded SHA-256 must equal `sha256`.
            Host validates all three relationships before invoking Runtime and
            never persists this value.
    StartTurnV2FileBlock:
      type: object
      additionalProperties: false
      required: [type, attachment_id, name, media_type, size_bytes, sha256, context_chunks]
      properties:
        type:
          type: string
          enum: [file]
          x-enum-varnames: [StartTurnV2ContentTypeFile]
        attachment_id:
          type: string
          format: uuid
          description: Desktop attachment identifier; correlation only, never a local path.
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[^/\\\x00-\x1F\x7F\s]([^/\\\x00-\x1F\x7F]*[^/\\\x00-\x1F\x7F\s])?$'
          not:
            enum: [".", ".."]
          description: |
            NFC display basename with no path separator, control character, or
            leading/trailing whitespace. It is untrusted text and must never be
            interpreted as a path, markup, authorization input, or log label.
        media_type:
          $ref: "#/components/schemas/StartTurnV2FileMediaType"
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 10485760
          description: Exact original file byte length verified by Desktop before parsing.
        sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: Lowercase hexadecimal SHA-256 of the original file bytes, verified by Desktop.
        context_chunks:
          type: array
          minItems: 1
          maxItems: 32
          description: |
            Ordered, untrusted plain-text excerpts selected locally from this file.
            Host maps them to bounded Runtime text input and never persists them.
            UTF-8 bytes across every file block in the turn must be at most 256 KiB.
          items:
            type: string
            minLength: 1
            maxLength: 16384
            pattern: \S
    StartTurnV2FileMediaType:
      type: string
      description: Canonical media type produced after Desktop format and container validation.
      enum:
        - application/pdf
        - text/plain
        - text/markdown
        - text/csv
        - application/json
        - application/yaml
        - application/xml
        - text/html
        - application/rtf
        - application/vnd.openxmlformats-officedocument.wordprocessingml.document
        - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        - application/vnd.openxmlformats-officedocument.presentationml.presentation
      x-enum-varnames:
        - StartTurnV2FileMediaTypePDF
        - StartTurnV2FileMediaTypePlainText
        - StartTurnV2FileMediaTypeMarkdown
        - StartTurnV2FileMediaTypeCSV
        - StartTurnV2FileMediaTypeJSON
        - StartTurnV2FileMediaTypeYAML
        - StartTurnV2FileMediaTypeXML
        - StartTurnV2FileMediaTypeHTML
        - StartTurnV2FileMediaTypeRTF
        - StartTurnV2FileMediaTypeDOCX
        - StartTurnV2FileMediaTypeXLSX
        - StartTurnV2FileMediaTypePPTX
    GenerateTitleV2Request:
      type: object
      additionalProperties: false
      required: [operation_id, input]
      properties:
        operation_id:
          type: string
          format: uuid
          description: Idempotent title-generation operation identifier selected by Desktop.
        trace_id:
          type: string
          minLength: 1
          description: Correlation only; never authorization input.
        request_id:
          type: string
          minLength: 1
          description: Correlation only; never authorization input.
        input:
          type: string
          minLength: 1
          pattern: \S
          maxLength: 8192
          x-yijie-max-utf8-bytes: 8192
          description: First user text only; non-blank and at most 8 KiB UTF-8.
    GenerateTitleV2Response:
      type: object
      additionalProperties: false
      required: [operation_id, title]
      properties:
        operation_id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          x-yijie-max-graphemes: 40
          description: >-
            NFC, one-line untrusted plain text with 1..40 grapheme clusters and no
            control, bidi-control, HTML, or Markdown syntax.
    CleanupAgentSessionV2Request:
      type: object
      additionalProperties: false
      required: [operation_id]
      properties:
        operation_id:
          type: string
          format: uuid
          description: Idempotent deletion-saga operation identifier selected by Desktop.
        trace_id:
          type: string
          minLength: 1
          description: Correlation only; never authorization input.
        request_id:
          type: string
          minLength: 1
          description: Correlation only; never authorization input.
    CleanupAgentSessionV2CompletedResponse:
      type: object
      additionalProperties: false
      required: [operation_id, outcome, surfaces]
      properties:
        operation_id:
          type: string
          format: uuid
        outcome:
          type: string
          enum: [complete]
        surfaces:
          $ref: "#/components/schemas/CleanupCompletedSurfaces"
    CleanupCompletedSurfaces:
      type: object
      additionalProperties: false
      required: [runtime_thread_tree, host_mapping, host_replay]
      properties:
        runtime_thread_tree:
          type: string
          enum: [complete]
        host_mapping:
          type: string
          enum: [complete]
        host_replay:
          type: string
          enum: [complete]
    CleanupAgentSessionV2IncompleteResponse:
      type: object
      additionalProperties: false
      required: [operation_id, outcome, surfaces, error]
      properties:
        operation_id:
          type: string
          format: uuid
        outcome:
          type: string
          enum: [incomplete]
        surfaces:
          $ref: "#/components/schemas/CleanupIncompleteSurfaces"
        error:
          $ref: "#/components/schemas/CleanupIncompleteError"
    CleanupIncompleteSurfaces:
      type: object
      additionalProperties: false
      required: [runtime_thread_tree, host_mapping, host_replay]
      properties:
        runtime_thread_tree:
          $ref: "#/components/schemas/CleanupSurfaceStatus"
        host_mapping:
          $ref: "#/components/schemas/CleanupSurfaceStatus"
        host_replay:
          $ref: "#/components/schemas/CleanupSurfaceStatus"
    CleanupSurfaceStatus:
      type: string
      enum: [complete, incomplete, not_attempted]
    CleanupIncompleteError:
      type: object
      additionalProperties: false
      required: [code, reason_code, message]
      properties:
        code:
          type: string
          enum: [cleanup_incomplete]
        reason_code:
          type: string
          enum:
            - active_turn
            - terminal_unconfirmed
            - shared_thread_mapping
            - runtime_delete_failed
            - runtime_delete_unconfirmed
            - host_mapping_cleanup_failed
            - host_replay_cleanup_failed
            - operation_state_unavailable
            - internal_error
        message:
          type: string
          minLength: 1
    TurnOperationConflictError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [turn_operation_conflict]
            message:
              type: string
              minLength: 1
    TitleOperationConflictError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [title_operation_conflict]
            message:
              type: string
              minLength: 1
    TitleOutputInvalidError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [title_output_invalid]
            message:
              type: string
              minLength: 1
    TitleGenerationUnavailableError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [title_generation_unavailable]
            message:
              type: string
              minLength: 1
    CleanupOperationConflictError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [cleanup_operation_conflict]
            message:
              type: string
              minLength: 1
    ArtifactAcknowledgementV3Request:
      type: object
      additionalProperties: false
      required: [ack_id, size_bytes, sha256, local_committed_at]
      properties:
        ack_id:
          type: string
          format: uuid
          description: Desktop-selected idempotency identifier scoped to this artifact.
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 67108864
          description: Exact byte length verified at Desktop's atomic local commit boundary.
        sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: Lowercase SHA-256 verified against the completed event before local commit.
        local_committed_at:
          type: string
          format: date-time
          description: UTC timestamp recorded only after Desktop's atomic durable commit succeeds.
    ArtifactAcknowledgementV3Response:
      type: object
      additionalProperties: false
      required: [artifact_id, ack_id, status, cleanup_status, acknowledged_at]
      properties:
        artifact_id:
          type: string
          format: uuid
        ack_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [acknowledged]
        cleanup_status:
          type: string
          enum: [pending, completed]
        acknowledged_at:
          type: string
          format: date-time
    ArtifactErrorResponseV3:
      description: Content-free v3 artifact failure. It never contains a path, URL, token, digest, provider payload, or artifact bytes.
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - unauthorized
                - invalid_request
                - invalid_range
                - artifact_not_found
                - artifact_expired
                - artifact_not_ready
                - artifact_manifest_mismatch
                - artifact_ack_conflict
                - artifact_range_not_satisfiable
                - artifact_resource_unavailable
                - internal_error
            message:
              type: string
              minLength: 1
              maxLength: 256
    SkillListResponse:
      type: object
      additionalProperties: false
      required: [schema_version, catalog_revision, scanned_at, skills]
      properties:
        schema_version:
          type: integer
          format: int32
          enum: [1]
        catalog_revision:
          $ref: "#/components/schemas/Sha256"
        scanned_at:
          type: string
          format: date-time
        skills:
          type: array
          maxItems: 256
          items:
            $ref: "#/components/schemas/ManagedSkill"
    SkillScanResponse:
      type: object
      additionalProperties: false
      required: [operation_id, outcome, catalog_revision, scanned_at, skills]
      properties:
        operation_id:
          type: string
          format: uuid
        outcome:
          type: string
          enum: [complete]
        catalog_revision:
          $ref: "#/components/schemas/Sha256"
        scanned_at:
          type: string
          format: date-time
        skills:
          type: array
          maxItems: 256
          items:
            $ref: "#/components/schemas/ManagedSkill"
    SkillMutationResponse:
      type: object
      additionalProperties: false
      required: [operation_id, outcome, skill]
      properties:
        operation_id:
          type: string
          format: uuid
        outcome:
          type: string
          enum: [complete]
        skill:
          $ref: "#/components/schemas/ManagedSkill"
    ManagedSkill:
      type: object
      additionalProperties: false
      required:
        - id
        - runtime_name
        - version
        - catalog_status
        - maintenance_status
        - capability_readiness
        - installation_status
        - enabled
        - runtime_visible
        - failure_code
      properties:
        id:
          $ref: "#/components/schemas/SkillIdValue"
        runtime_name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        version:
          $ref: "#/components/schemas/SemanticVersion"
        catalog_status:
          type: string
          enum: [installable, blocked]
        catalog_blocked_reason:
          type: string
          description: |
            Required by the Skills v1 semantic contract for every blocked catalog
            projection and omitted for an installable entry. It exposes exactly
            one stable primary reason and never includes source text, archive
            metadata, filesystem locations, or free-form upstream failure details.
          enum:
            - source_unverified
            - license_unverified
            - distribution_not_authorized
            - security_review_pending
            - capability_unavailable
            - maintenance_ended
        maintenance_status:
          type: string
          enum: [maintained, unmaintained]
        capability_readiness:
          type: string
          enum: [ready, degraded, blocked]
        installation_status:
          type: string
          enum: [not_installed, installing, installed, uninstalling, error]
        enabled:
          type: boolean
          description: False when not installed or explicitly disabled.
        runtime_visible:
          type: boolean
          description: True only after Runtime confirms the exact installed and enabled Skill in its current projection.
        failure_code:
          type: string
          enum:
            - ""
            - bundle_missing
            - bundle_manifest_invalid
            - archive_checksum_mismatch
            - archive_unsafe
            - archive_too_large
            - install_receipt_invalid
            - installed_files_missing
            - installed_files_corrupt
            - capability_unavailable
            - runtime_unavailable
            - runtime_sync_failed
            - install_failed
            - uninstall_failed
            - scan_failed
    SkillScanRequest:
      type: object
      additionalProperties: false
      required: [operation_id, reason]
      properties:
        operation_id:
          type: string
          format: uuid
        reason:
          type: string
          enum: [startup, page_open, app_upgrade, window_resume, directory_changed, user_retry]
    SkillInstallRequest:
      type: object
      additionalProperties: false
      required: [operation_id, expected_version, expected_archive_sha256, catalog_revision]
      properties:
        operation_id:
          type: string
          format: uuid
        expected_version:
          $ref: "#/components/schemas/SemanticVersion"
        expected_archive_sha256:
          $ref: "#/components/schemas/Sha256"
        catalog_revision:
          $ref: "#/components/schemas/Sha256"
    SkillEnabledRequest:
      type: object
      additionalProperties: false
      required: [operation_id, enabled]
      properties:
        operation_id:
          type: string
          format: uuid
        enabled:
          type: boolean
    SkillUninstallRequest:
      type: object
      additionalProperties: false
      required: [operation_id]
      properties:
        operation_id:
          type: string
          format: uuid
    SkillIdValue:
      type: string
      minLength: 3
      maxLength: 128
      pattern: "^[a-z][a-z0-9]*(?:[.-][a-z0-9]+)*$"
    SemanticVersion:
      type: string
      pattern: "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?$"
    Sha256:
      description: Lowercase SHA-256. When this schema is used by a property named `catalog_revision`, the digest is over the exact raw validated `bundle-manifest.json` bytes; install compares it in constant time without re-serialization or normalization.
      type: string
      pattern: "^[a-f0-9]{64}$"
    SkillErrorResponse:
      description: Content-free Skill management failure. It never contains a path, token, archive bytes, Skill instructions, or Runtime payload.
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - unauthorized
                - capability_denied
                - invalid_request
                - skill_not_found
                - skill_not_installable
                - skill_operation_conflict
                - skill_busy
                - bundle_missing
                - bundle_manifest_invalid
                - archive_checksum_mismatch
                - archive_unsafe
                - archive_too_large
                - install_failed
                - uninstall_failed
                - scan_failed
                - runtime_unavailable
                - runtime_sync_failed
                - internal_error
            message:
              type: string
              minLength: 1
              maxLength: 256
    SessionResponse:
      type: object
      additionalProperties: false
      required: [session]
      properties:
        session:
          $ref: "#/components/schemas/AgentSession"
    AgentSession:
      type: object
      additionalProperties: false
      required:
        - task_id
        - agent_session_id
        - codex_thread_id
        - active_turn_id
        - state
        - cwd
        - model
        - model_provider
        - failure_code
        - created_at
        - updated_at
      properties:
        task_id:
          type: string
          format: uuid
        agent_session_id:
          type: string
          format: uuid
        codex_thread_id:
          $ref: "#/components/schemas/UuidOrEmpty"
        active_turn_id:
          $ref: "#/components/schemas/UuidOrEmpty"
        state:
          type: string
          enum: [starting, idle, active, failed]
        cwd:
          type: string
          minLength: 1
          pattern: ^/
          description: Rehydrated canonical absolute session working directory.
        model:
          type: string
          enum: ["", MiniMax-M3]
        model_provider:
          type: string
          enum: ["", minimax]
        failure_code:
          type: string
          enum:
            - ""
            - thread_start_failed
            - thread_start_response_invalid
            - provider_identity_mismatch
            - thread_resume_failed
            - thread_resume_response_invalid
            - turn_start_failed
            - turn_start_response_invalid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UuidOrEmpty:
      description: A UUID when bound, otherwise the empty string.
      type: string
      pattern: "^$|^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$"
    StartTurnResponse:
      type: object
      additionalProperties: false
      required: [turn_id]
      properties:
        turn_id:
          type: string
          format: uuid
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - unauthorized
                - invalid_request
                - session_not_found
                - task_session_exists
                - turn_active
                - turn_not_active
                - session_not_usable
                - event_stream_changed
                - event_replay_unavailable
                - invalid_event_cursor
                - runtime_request_failed
                - streaming_unsupported
                - internal_error
            message:
              type: string
              minLength: 1
