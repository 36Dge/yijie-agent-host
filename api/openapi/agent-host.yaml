openapi: 3.0.3
info:
  title: Yijie Agent Host Local API
  version: 0.6.0
  description: |
    Local loopback HTTP and Server-Sent Events contract for the Yijie Desktop
    Agent Host sidecar. The Host is a thin adapter over the pinned Codex Runtime;
    it is not a public or service-to-service API.

    The three system endpoints are unauthenticated so the process can be
    diagnosed before Runtime initialization. Every session, turn, and event
    endpoint and every Skill management endpoint requires the owner-only bearer
    token generated in the Host home.

    In the exact `YIJIE_ENV=local` + `YIJIE_LOCAL_PROFILE=demo_fast` Desktop
    profile, the native launcher establishes a fixed local identity with the
    declared capabilities and supplies this bearer transparently. The user sees
    no login, account-authentication, or permission-prompt flow. This usability
    rule does not remove the process boundary and must not be enabled for a
    public or production listener.

    This document is authoritative for HTTP paths, authentication, request and
    response envelopes, status codes, headers, and SSE framing. The JSON value
    carried by each SSE `data` line is governed by the explicitly negotiated
    AgentSessionEvent v1, v2, v3, or v4 JSON Schema, not by a duplicate OpenAPI schema.
  contact:
    name: Yijie Agent Host owners
servers:
  - url: http://127.0.0.1:{port}
    description: Desktop sidecar loopback listener. It must not be exposed on a non-loopback interface.
    variables:
      port:
        default: "18080"
        description: Port selected for the local Agent Host process.
security:
  - localBearer: []
tags:
  - name: System
    description: Unauthenticated liveness, readiness, and sanitized Runtime identity.
  - name: Sessions
    description: Persistent task-to-Agent-session and Runtime-thread mappings.
  - name: Turns
    description: Text turn lifecycle operations for one Agent session.
  - name: Events
    description: Process-local, bounded SSE replay and live delivery.
  - name: Artifacts
    description: Owner-only v3 structured-artifact content, poster, and commit acknowledgement.
  - name: Skills
    description: Owner-only local Skill catalog, installation state, and Runtime visibility management.
paths:
  /healthz:
    get:
      operationId: getAgentHostHealth
      summary: Check Host process liveness
      description: |
        Reports only that the Agent Host HTTP process is alive. Runtime may be
        unconfigured, unavailable, or failed while this endpoint still returns
        `200`.
      tags: [System]
      security: []
      responses:
        "200":
          description: The Agent Host process is alive.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                service: yijie-agent-host
                status: ok
  /readyz:
    get:
      operationId: getAgentHostReadiness
      summary: Check Runtime readiness
      description: |
        Returns `200` only after the managed Codex Runtime completed its
        initialization handshake. This is the gate clients should observe before
        enabling session operations.
      tags: [System]
      security: []
      responses:
        "200":
          description: The managed Runtime is initialized and ready.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
              example:
                status: ready
                runtime_state: ready
        "503":
          description: The managed Runtime is not ready.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotReadyResponse"
              example:
                status: not_ready
                runtime_state: failed
  /v1/status:
    get:
      operationId: getAgentHostStatus
      summary: Get sanitized Host and Runtime status
      description: |
        Returns the pinned Runtime identity and lifecycle state without exposing
        local binary, manifest, credential, or home-directory paths.
      tags: [System]
      security: []
      responses:
        "200":
          description: Current sanitized Agent Host status.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHostStatus"
  /v1/tasks/{task_id}/agent-sessions:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      operationId: startAgentSession
      summary: Start the Agent session for a task
      description: |
        Creates the one Agent session allowed for `task_id`, starts a persistent
        Runtime thread in `cwd`, and stores only the recovery mapping and status.
        A failed Runtime start can leave a queryable failed session reserved for
        the task.
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartSessionRequest"
      responses:
        "201":
          description: The session and Runtime thread were created and bound.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: |
            `invalid_request`: malformed or oversized JSON, an unknown field, an
            invalid task identifier, or a `cwd` that is not an existing absolute
            directory.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: invalid_request
                  message: request parameters are invalid
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: "`task_session_exists`: the task already owns an Agent session."
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: task_session_exists
                  message: task already has an agent session
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/RuntimeRequestFailed"
  /v1/agent-sessions/{agent_session_id}/resume:
    parameters:
      - $ref: "#/components/parameters/AgentSessionId"
    post:
      operationId: resumeAgentSession
      summary: Resume the session's Runtime thread
      description: |
        Resumes the persisted Runtime thread mapping after a Runtime restart and
        refreshes the current/last turn state. It does not restore SSE content
        from an earlier Host process.
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TraceRequest"
      responses:
        "200":
          description: The Runtime thread was resumed and session state refreshed.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/SessionNotFound"
        "409":
          description: "`session_not_usable`: the session has no Runtime thread that can be resumed."
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: session_not_usable
                  message: agent session cannot perform this operation
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/RuntimeRequestFailed"
  /v1/agent-sessions/{agent_session_id}:
    parameters:
      - $ref: "#/components/parameters/AgentSessionId"
    get:
      operationId: getAgentSession
      summary: Get the persisted Agent session state
      description: Returns mapping and lifecycle state only; message content is not persisted by the Host.
      tags: [Sessions]
      responses:
        "200":
          description: Current Agent session state.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/SessionNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/agent-sessions/{agent_session_id}/turns:
    parameters:
      - $ref: "#/components/parameters/AgentSessionId"
    post:
      operationId: startAgentTurn
      summary: Start a text turn
      description: |
        Starts one text-only Runtime turn. At most one turn may be active for a
        session. The accepted response identifies the turn; progress and terminal
        state are delivered through the event stream.
      tags: [Turns]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartTurnRequest"
      responses:
        "202":
          description: The Runtime accepted the turn.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartTurnResponse"
        "400":
          description: |
            `invalid_request`: malformed or oversized JSON, an unknown field, an
            invalid session identifier, blank/oversized input, or an unsupported
            reasoning effort.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: invalid_request
                  message: request parameters are invalid
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/SessionNotFound"
        "409":
          description: |
            `turn_active` when another turn is active, or `session_not_usable`
            when the session has no usable Runtime thread.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                turnActive:
                  value:
                    error:
                      code: turn_active
                      message: agent session already has an active turn
                sessionNotUsable:
                  value:
                    error:
                      code: session_not_usable
                      message: agent session cannot perform this operation
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/RuntimeRequestFailed"
  /v1/agent-sessions/{agent_session_id}/turns/{turn_id}/interrupt:
    parameters:
      - $ref: "#/components/parameters/AgentSessionId"
      - $ref: "#/components/parameters/TurnId"
    post:
      operationId: interruptAgentTurn
      summary: Interrupt the active turn
      description: Only the session's current active `turn_id` can be interrupted.
      tags: [Turns]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TraceRequest"
      responses:
        "204":
          description: The interrupt request was delivered to Runtime. Terminal state follows by SSE.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/SessionNotFound"
        "409":
          description: "`turn_not_active`: `turn_id` is not the session's active turn."
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: turn_not_active
                  message: turn is not active for this agent session
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/RuntimeRequestFailed"
  /v1/agent-sessions/{agent_session_id}/events:
    parameters:
      - $ref: "#/components/parameters/AgentSessionId"
    get:
      operationId: streamAgentSessionEvents
      summary: Replay and stream Agent session events
      description: |
        Opens a Server-Sent Events stream. Each event frame has:

        - `id: <stream_id>:<sequence>`;
        - `event: <event_type>`;
        - one single-line `data:` value containing an AgentSessionEvent JSON object.

        Sequence is strictly increasing only within a `stream_id`. Event content
        is retained in bounded process memory (512 events in the desktop Host),
        is not persisted by Agent Host, and is delivered at least once across
        reconnect/replay; consumers deduplicate with `event_id`.

        `Last-Event-ID` takes precedence over both query parameters and carries
        the complete cursor. Without that header, `after > 0` requires the
        matching `stream_id`. The server replays retained events with sequence
        greater than `after`, then continues with live events. A heartbeat comment
        `: heartbeat` is sent every 15 seconds when no event is written. Slow
        consumers may be disconnected and should reconnect with their last fully
        processed event ID.
      tags: [Events]
      externalDocs:
        description: Authoritative AgentSessionEvent JSON Schema
        url: https://contracts.yijie.ai/agent/session-event.schema.json
      parameters:
        - $ref: "#/components/parameters/EventStreamId"
        - $ref: "#/components/parameters/EventAfter"
        - $ref: "#/components/parameters/LastEventId"
      responses:
        "200":
          description: |
            Retained events were replayed and the connection is subscribed for
            live events. The body remains open until client cancellation, write
            failure, Host shutdown, or slow-consumer disconnection.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Accel-Buffering:
              description: Disables reverse-proxy response buffering.
              required: true
              schema:
                type: string
                enum: ["no"]
            X-Yijie-Event-Stream-ID:
              description: Actual process-local stream identifier used by every returned SSE event ID.
              required: true
              schema:
                type: string
                format: uuid
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  UTF-8 SSE frames. Each non-heartbeat frame's `data` value is a
                  compact, single-line JSON instance of AgentSessionEvent. See
                  `jsonschema/agent/session-event.schema.json` in this repository.
                x-yijie-event-data-schema: ../../jsonschema/agent/session-event.schema.json
              example: |
                id: 019f8b05-de28-7031-bab1-931dba37a6e9:1
                event: thread.started
                data: {"schema_version":1,"event_id":"019f8b06-0ea1-7c0d-97a7-3cd3bdeaf2e0","stream_id":"019f8b05-de28-7031-bab1-931dba37a6e9","sequence":1,"occurred_at":"2026-07-23T10:00:00Z","task_id":"019f8b00-a433-71c4-9ce6-54ea5de8236d","agent_session_id":"019f8b02-385a-7469-abeb-92f4d1f5e49c","codex_thread_id":"019f8b03-6d0b-7fd0-a273-9b6bc6796610","event_type":"thread.started","terminal":false,"payload":{"model":"MiniMax-M3","model_provider":"minimax"}}

        "400":
          description: |
            `invalid_request` for an invalid session identifier;
            `invalid_event_cursor` for malformed `Last-Event-ID`, an invalid
            unsigned sequence, `after > 0` without a stream ID, or a sequence
            greater than the latest event.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidCursor:
                  value:
                    error:
                      code: invalid_event_cursor
                      message: event cursor is invalid
                invalidSessionId:
                  value:
                    error:
                      code: invalid_request
                      message: request parameters are invalid
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/SessionNotFound"
        "409":
          description: |
            `event_stream_changed` when the supplied stream ID belongs to an
            earlier Host process; `event_replay_unavailable` when the requested
            sequence has fallen out of the bounded replay window. Clients must
            reconcile current session state instead of silently skipping either
            condition.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                streamChanged:
                  value:
                    error:
                      code: event_stream_changed
                      message: event stream changed after Host restart
                replayUnavailable:
                  value:
                    error:
                      code: event_replay_unavailable
                      message: requested events are no longer available
        "500":
          description: |
            `streaming_unsupported` when the HTTP writer cannot flush streaming
            responses; otherwise `internal_error`.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                streamingUnsupported:
                  value:
                    error:
                      code: streaming_unsupported
                      message: streaming is unavailable
                internalError:
                  value:
                    error:
                      code: internal_error
                      message: Agent Host operation failed
  /v2/agent-sessions/{agent_session_id}/turns:
    parameters:
      - $ref: "#/components/parameters/AgentSessionId"
    post:
      operationId: startAgentTurnV2
      summary: Start an ordered multimodal turn
      description: |
        Starts one Runtime turn from an ordered, closed sequence of text, image,
        and file-context blocks. At most one turn may be active for a session.
        The accepted response identifies the turn; progress and terminal state
        are delivered through the explicitly negotiated event stream.

        Desktop resolves attachment ownership, readiness, and seven-day expiry,
        and revalidates file size and SHA-256 against its local authority before
        calling Host. Host treats every name and text value as untrusted,
        revalidates each decoded image's media type, size, and digest, and does
        not persist the data URL or context chunks in bbolt, replay, logs,
        metrics, or traces. Files are represented only by Desktop-selected text
        context; raw file bytes and local paths are never accepted, so file size
        and digest remain Desktop-verified correlation metadata rather than Host
        authorization input.

        A request may contain at most 10 image/file blocks. Decoded image bytes
        across the complete turn must not exceed 10 MiB, and UTF-8 file context
        across all file blocks must not exceed 256 KiB. Host enforces these
        aggregate limits before invoking Runtime. They are semantic cross-block
        constraints in addition to the per-field schema bounds.

        `operation_id` is scoped to the Agent session and the canonical ordered
        content blocks plus reasoning effort. Replaying the same operation and
        canonical input returns the original accepted `turn_id` without invoking
        Runtime again. Reusing the operation ID with different canonical input
        returns `turn_operation_conflict`.
      tags: [Turns]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartTurnV2Request"
      responses:
        "202":
          description: The Runtime accepted the ordered multimodal turn, or the original accepted result was replayed idempotently.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartTurnResponse"
        "400":
          description: |
            `invalid_request`: malformed or oversized JSON, an unknown field, an
            invalid session identifier, an invalid content block, a mismatched
            data-URL media type, size, or digest, more than 10 attachment blocks,
            an exceeded aggregate image/context limit, or an unsupported
            reasoning effort.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: invalid_request
                  message: request parameters are invalid
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/SessionNotFound"
        "409":
          description: |
            `turn_active` when another turn is active; `session_not_usable` when
            the session has no usable Runtime thread; or
            `turn_operation_conflict` when an operation ID is reused with
            different canonical input.
          x-yijie-error-codes: [turn_active, session_not_usable, turn_operation_conflict]
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/TurnOperationConflictError"
              examples:
                turnActive:
                  value:
                    error:
                      code: turn_active
                      message: agent session already has an active turn
                sessionNotUsable:
                  value:
                    error:
                      code: session_not_usable
                      message: agent session cannot perform this operation
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/RuntimeRequestFailed"
  /v2/agent-sessions/{agent_session_id}/title-generations:
    parameters:
      - $ref: "#/components/parameters/AgentSessionId"
    post:
      operationId: generateAgentSessionTitleV2
      summary: Generate one isolated title candidate
      description: |
        Runs the fixed `title-v1` prompt in a pathless ephemeral Runtime thread
        that is isolated from the user's project, persistent thread, and event
        stream. The Host accepts only the first user text, invokes no tools, and
        returns only a validated plain-text title. Prompt text, raw provider
        response, ephemeral identifiers, and project paths never enter the
        response, logs, metrics, traces, or persistent Host state.

        `operation_id` is scoped to this Agent session and canonical input. The
        same operation and input may return its process-local completed result;
        reuse with different input returns `title_operation_conflict`. An unknown
        provider result is not retried under a new operation ID. This candidate
        does not enable the operation or authorize provider calls.
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateTitleV2Request"
      responses:
        "200":
          description: A sanitized title candidate was generated.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateTitleV2Response"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/SessionNotFound"
        "409":
          $ref: "#/components/responses/TitleOperationConflict"
        "422":
          $ref: "#/components/responses/TitleOutputInvalid"
        "503":
          $ref: "#/components/responses/TitleGenerationUnavailable"
  /v2/agent-sessions/{agent_session_id}/cleanup-operations:
    parameters:
      - $ref: "#/components/parameters/AgentSessionId"
    post:
      operationId: cleanupAgentSessionV2
      summary: Remove the Host-managed live surfaces for one Agent session
      description: |
        Performs the Host portion of the Desktop deletion saga. The Host first
        rejects an active or unconfirmed turn and verifies exclusive ownership of
        the mapped Runtime thread tree. It then verifies Runtime `thread/delete`,
        including the deletion notification and descendants, before clearing the
        Host bbolt mapping and in-memory replay state.

        `200` means all three Host-managed live surfaces are confirmed complete.
        Any partial or uncertain result is `409 cleanup_incomplete` with a
        content-free per-surface result and remains retryable under the same
        `operation_id`. To resolve a lost success response after the mapping is
        removed, Host retains for 30 days only a content-free receipt containing
        operation ID, keyed session hash, surface outcomes, timestamps, and schema
        version; it contains no raw session/thread ID, body, title, reasoning, or
        path. A completed Host result does not claim that Desktop SQLCipher/
        checkpoint, Runtime WAL/log bytes, OS snapshots, backups, or SSD history
        were erased; Desktop may report full session deletion only after its
        separately approved local transaction and checkpoint also complete.
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CleanupAgentSessionV2Request"
      responses:
        "200":
          description: Runtime thread tree, Host mapping, and Host replay are all absent from active stores.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CleanupAgentSessionV2CompletedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/SessionNotFound"
        "409":
          description: >-
            `cleanup_incomplete` when any required surface is partial, blocked, or
            uncertain; `cleanup_operation_conflict` when an operation ID is reused
            for a different target or canonical request.
          x-yijie-error-codes: [cleanup_incomplete, cleanup_operation_conflict]
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CleanupAgentSessionV2IncompleteResponse"
                  - $ref: "#/components/schemas/CleanupOperationConflictError"
  /v2/agent-sessions/{agent_session_id}/events:
    parameters:
      - $ref: "#/components/parameters/AgentSessionId"
    get:
      operationId: streamAgentSessionEventsV2
      summary: Replay and stream explicitly negotiated Agent session events v2
      description: |
        Opens the v2 Server-Sent Events stream. The required
        `event_schema_version=2` query parameter prevents accidental v2 output to a
        v1 consumer. Framing, cursor precedence, bounded in-memory replay, heartbeat,
        at-least-once delivery, and stream-change semantics are identical to the v1
        endpoint. Every non-heartbeat `data` value is a compact single-line
        AgentSessionEventV2 JSON object. The Host must not persist raw-reasoning text
        in bbolt, any durable replay store, logs, metrics, traces, audit, or error
        bodies; bounded process-memory replay remains permitted.

        The v2 stream preserves the eight v1 lifecycle variants and adds only
        `item.reasoning_text.delta` and `item.reasoning_text.finalized`. A single SSE
        event remains bounded by the Host's 1 MiB hard limit; the stricter reasoning
        caps are authoritative in the v2 JSON Schema and associated conformance docs.
      tags: [Events]
      externalDocs:
        description: Authoritative AgentSessionEventV2 JSON Schema
        url: https://contracts.yijie.ai/agent/session-event-v2.schema.json
      parameters:
        - $ref: "#/components/parameters/EventSchemaVersionV2"
        - $ref: "#/components/parameters/EventStreamId"
        - $ref: "#/components/parameters/EventAfter"
        - $ref: "#/components/parameters/LastEventId"
      responses:
        "200":
          description: Retained v2 events were replayed and the connection is subscribed for live v2 events.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Accel-Buffering:
              description: Disables reverse-proxy response buffering.
              required: true
              schema:
                type: string
                enum: ["no"]
            X-Yijie-Event-Stream-ID:
              description: Actual process-local stream identifier used by every returned SSE event ID.
              required: true
              schema:
                type: string
                format: uuid
            X-Yijie-Event-Schema-Version:
              description: Confirms that every returned data event uses AgentSessionEventV2.
