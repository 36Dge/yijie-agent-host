{
  "openapi": "3.0.3",
  "info": {
    "title": "Yijie Native Conversation Trace v6",
    "version": "0.9.1",
    "description": "Canonical provider search sources, distinct from assistant citations. Native lifecycle and permissions unchanged. Legacy history v1/v2/v3 and SSE v7/v8/v10 retain their projections. FEAT-169 adds native fileChange and subAgentActivity display facts; requires paired local consumers, without rewriting existing records. Public message publication v2 is negotiated with X-Yijie-Publication. Unnegotiated readers receive the original shape."
  },
  "servers": [
    {
      "url": "http://127.0.0.1:9130"
    }
  ],
  "security": [
    {
      "LocalBearer": []
    }
  ],
  "paths": {
    "/v6/agent-sessions/{agent_session_id}/native-thread": {
      "parameters": [
        {
          "name": "agent_session_id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "format": "uuid"
          }
        }
      ],
      "get": {
        "operationId": "readNativeThreadProcess",
        "summary": "Read the native Codex history without resuming or executing a turn",
        "responses": {
          "200": {
            "description": "Partial native history; absence never deletes observed facts",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/NativeThreadSnapshot"
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            }
          },
          "404": {
            "description": "Session not found",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            }
          },
          "503": {
            "description": "Native history unavailable",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            }
          }
        },
        "parameters": [
          {
            "in": "header",
            "name": "X-Yijie-Search-Receipt",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "2"
              ]
            },
            "description": "Opt in to typed receipt projection for the builtin deep-search tool."
          },
          {
            "name": "X-Yijie-Publication",
            "in": "header",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "2"
              ]
            },
            "description": "Opt in to stable message identities, publication provenance and bounded undelivered text."
          }
        ]
      }
    },
    "/v13/agent-sessions/{agent_session_id}/events": {
      "parameters": [
        {
          "name": "agent_session_id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "format": "uuid"
          }
        },
        {
          "name": "stream_id",
          "in": "query",
          "schema": {
            "type": "string",
            "format": "uuid"
          }
        },
        {
          "name": "after",
          "in": "query",
          "schema": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          }
        },
        {
          "name": "Last-Event-ID",
          "in": "header",
          "schema": {
            "type": "string",
            "maxLength": 128
          }
        }
      ],
      "get": {
        "operationId": "streamNativeConversationProcess",
        "summary": "Subscribe to safe native notifications using the existing bounded SSE transport",
        "description": "Native facts only. Last-Event-ID takes precedence. At-least-once within a process stream; deduplicate once at Native ingress. Stream changes/gaps require explicit read/resume, never submission retry. Snapshot reads have no SSE watermark and must not be merged item by item with live events. Projection notices are not execution terminals. Native turn/completed contains no final item collection. Command output deltas are not forwarded: a partial projection notice is emitted and safe final aggregatedOutput is used. This prevents secrets split across chunks without a second Host accumulator. Error responses do not include raw Runtime payloads.",
        "responses": {
          "200": {
            "description": "SSE event native.notification; data is NativeEvent",
            "content": {
              "text/event-stream": {
                "schema": {
                  "type": "string"
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            }
          },
          "409": {
            "description": "Stream changed or replay unavailable",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            }
          },
          "404": {
            "description": "Session not found",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            }
          }
        },
        "parameters": [
          {
            "in": "header",
            "name": "X-Yijie-Search-Receipt",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "2"
              ]
            },
            "description": "Opt in to typed receipt projection for the builtin deep-search tool."
          },
          {
            "name": "X-Yijie-Publication",
            "in": "header",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "2"
              ]
            },
            "description": "Opt in to stable message identities, publication provenance and bounded undelivered text."
          }
        ]
      }
    }
  },
  "components": {
    "securitySchemes": {
      "LocalBearer": {
        "type": "http",
        "scheme": "bearer"
      }
    },
    "schemas": {
      "NativeItem": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "type",
          "availability"
        ],
        "properties": {
          "id": {
            "type": "string",
            "maxLength": 512
          },
          "type": {
            "type": "string",
            "enum": [
              "userMessage",
              "agentMessage",
              "reasoning",
              "commandExecution",
              "mcpToolCall",
              "webSearch",
              "fileChange",
              "subAgentActivity",
              "imageView",
              "unknown",
              "unpublishedText"
            ]
          },
          "clientId": {
            "type": "string",
            "maxLength": 512,
            "nullable": true
          },
          "text": {
            "type": "string",
            "maxLength": 1048576
          },
          "phase": {
            "type": "string",
            "enum": [
              "commentary",
              "final_answer"
            ],
            "nullable": true
          },
          "summary": {
            "type": "array",
            "maxItems": 128,
            "items": {
              "type": "string",
              "maxLength": 1048576
            }
          },
          "content": {
            "type": "array",
            "maxItems": 128,
            "items": {
              "type": "string",
              "maxLength": 1048576
            }
          },
          "status": {
            "type": "string",
            "enum": [
              "inProgress",
              "completed",
              "failed",
              "declined"
            ],
            "nullable": true
          },
          "exitCode": {
            "type": "integer",
            "format": "int32",
            "nullable": true
          },
          "durationMs": {
            "type": "integer",
            "format": "int64",
            "minimum": 0,
            "nullable": true
          },
          "argumentsSummary": {
            "type": "string",
            "maxLength": 4096,
            "description": "Metadata display only; raw native arguments never leave Host. For yijie_web/kimi_web_search_pro this may contain the validated, displayable query alone. An observed yijie_web/kimi_web_fetch may identify the requested website by hostname only."
          },
          "resultSummary": {
            "type": "string",
            "maxLength": 8192,
            "description": "Metadata display only, omitted when native result is absent or null. For an observed successful built-in fetch this may contain the bounded, confidentiality-checked page title."
          },
          "availability": {
            "type": "string",
            "enum": [
              "available",
              "partial",
              "unavailable"
            ],
            "description": "Completeness of this safe display projection, independent of the native execution status."
          },
          "commandLabel": {
            "type": "string",
            "maxLength": 8192,
            "description": "Security projection label, not the original command. No execution semantics are inferred."
          },
          "cwdLabel": {
            "type": "string",
            "maxLength": 1024,
            "description": "Workspace-relative display label; never the native absolute path."
          },
          "outputText": {
            "type": "string",
            "maxLength": 1048576,
            "description": "Bounded, redacted projection of native aggregatedOutput. Omitted when native output is null or unavailable."
          },
          "toolLabel": {
            "type": "string",
            "maxLength": 256,
            "description": "Safe display label, not a registered tool identifier. Tool registration is outside FEAT-132."
          },
          "mcp": {
            "$ref": "#/components/schemas/NativeMcpDisplay"
          },
          "webSearch": {
            "$ref": "#/components/schemas/NativeWebSearchDisplay"
          },
          "commandActions": {
            "type": "array",
            "maxItems": 64,
            "items": {
              "$ref": "#/components/schemas/NativeCommandActionDisplay"
            }
          },
          "toolDisplay": {
            "$ref": "#/components/schemas/NativeToolDisplay"
          },
          "publication": {
            "$ref": "#/components/schemas/NativeMessagePublication"
          }
        }
      },
      "NativeTurn": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "status",
          "items",
          "itemsComplete"
        ],
        "properties": {
          "id": {
            "type": "string",
            "maxLength": 512
          },
          "status": {
            "type": "string",
            "enum": [
              "inProgress",
              "completed",
              "interrupted",
              "failed"
            ],
            "nullable": true
          },
          "errorCode": {
            "type": "string",
            "maxLength": 128,
            "description": "Safe diagnostic category for a native error; not the raw error payload. Native status is preserved separately."
          },
          "items": {
            "type": "array",
            "maxItems": 512,
            "items": {
              "$ref": "#/components/schemas/NativeItem"
            }
          },
          "itemsComplete": {
            "type": "boolean"
          },
          "error": {
            "$ref": "#/components/schemas/NativeError"
          }
        }
      },
      "NativePlanStep": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "step",
          "status"
        ],
        "properties": {
          "step": {
            "type": "string",
            "maxLength": 65536
          },
          "status": {
            "type": "string",
            "enum": [
              "pending",
              "inProgress",
              "completed"
            ]
          }
        }
      },
      "NativeNotification": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "source",
          "method",
          "threadId",
          "availability"
        ],
        "properties": {
          "source": {
            "type": "string",
            "enum": [
              "runtime_notification",
              "projection_notice"
            ]
          },
          "method": {
            "type": "string",
            "maxLength": 128
          },
          "threadId": {
            "type": "string",
            "maxLength": 512
          },
          "turnId": {
            "type": "string",
            "maxLength": 512
          },
          "itemId": {
            "type": "string",
            "maxLength": 512
          },
          "item": {
            "$ref": "#/components/schemas/NativeItem"
          },
          "turn": {
            "$ref": "#/components/schemas/NativeTurn"
          },
          "delta": {
            "type": "string",
            "maxLength": 1048576
          },
          "index": {
            "type": "integer",
            "minimum": 0,
            "maximum": 127
          },
          "plan": {
            "type": "array",
            "maxItems": 128,
            "items": {
              "$ref": "#/components/schemas/NativePlanStep"
            }
          },
          "explanation": {
            "type": "string",
            "maxLength": 65536,
            "nullable": true
          },
          "code": {
            "type": "string",
            "maxLength": 128
          },
          "availability": {
            "type": "string",
            "enum": [
              "available",
              "partial",
              "unavailable"
            ]
          },
          "willRetry": {
            "type": "boolean",
            "nullable": true,
            "description": "Native retry intent only. Omitted/null means unknown, never false; does not drive client execution."
          }
        }
      },
      "NativeThreadSnapshot": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "schema_version",
          "source",
          "thread_id",
          "turns",
          "availability"
        ],
        "properties": {
          "schema_version": {
            "type": "integer",
            "enum": [
              6
            ]
          },
          "source": {
            "type": "string",
            "enum": [
              "runtime_read",
              "runtime_resume"
            ]
          },
          "thread_id": {
            "type": "string",
            "maxLength": 512
          },
          "turns": {
            "type": "array",
            "maxItems": 1024,
            "items": {
              "$ref": "#/components/schemas/NativeTurn"
            }
          },
          "availability": {
            "type": "string",
            "enum": [
              "partial",
              "unavailable"
            ]
          }
        }
      },
      "NativeEvent": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "schema_version",
          "event_id",
          "stream_id",
          "sequence",
          "occurred_at",
          "task_id",
          "agent_session_id",
          "codex_thread_id",
          "event_type",
          "terminal",
          "payload"
        ],
        "properties": {
          "schema_version": {
            "type": "integer",
            "enum": [
              13
            ]
          },
          "event_id": {
            "type": "string",
            "format": "uuid"
          },
          "stream_id": {
            "type": "string",
            "format": "uuid"
          },
          "sequence": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          },
          "occurred_at": {
            "type": "string",
            "format": "date-time"
          },
          "task_id": {
            "type": "string",
            "format": "uuid"
          },
          "agent_session_id": {
            "type": "string",
            "format": "uuid"
          },
          "codex_thread_id": {
            "type": "string",
            "format": "uuid"
          },
          "turn_id": {
            "type": "string",
            "maxLength": 512
          },
          "item_id": {
            "type": "string",
            "maxLength": 512
          },
          "event_type": {
            "type": "string",
            "enum": [
              "native.notification"
            ]
          },
          "terminal": {
            "type": "boolean"
          },
          "payload": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "native"
            ],
            "properties": {
              "native": {
                "$ref": "#/components/schemas/NativeNotification"
              }
            }
          }
        }
      },
      "NativeError": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "availability"
        ],
        "properties": {
          "availability": {
            "type": "string",
            "enum": [
              "partial",
              "unavailable"
            ]
          },
          "messageText": {
            "type": "string",
            "maxLength": 4096,
            "description": "Bounded redacted native message, not an inferred execution result."
          },
          "codexErrorInfo": {
            "type": "string",
            "enum": [
              "contextWindowExceeded",
              "sessionBudgetExceeded",
              "usageLimitExceeded",
              "serverOverloaded",
              "cyberPolicy",
              "httpConnectionFailed",
              "responseStreamConnectionFailed",
              "internalServerError",
              "unauthorized",
              "badRequest",
              "threadRollbackFailed",
              "sandboxError",
              "responseStreamDisconnected",
              "responseTooManyFailedAttempts",
              "activeTurnNotSteerable",
              "other"
            ],
            "description": "Allowlisted native discriminator. Unknown native details are omitted."
          }
        }
      },
      "NativeMcpText": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "index",
          "text"
        ],
        "properties": {
          "index": {
            "type": "integer",
            "minimum": 0,
            "maximum": 31,
            "description": "Original native content array index; never renumber after filtering."
          },
          "text": {
            "type": "string",
            "maxLength": 262144,
            "description": "Plain text after confidentiality projection and UTF-8 truncation. For an observed built-in fetch, index 0 may contain a short reading outcome derived from a validated FetchSuccess, or the fixed message from a validated public fetch error. The fetched body is excluded. At index 0, built-in deep search may project SearchSuccess (title, url and snippet) or a validated public retrieval error. For newly observed results, url preserves the public HTTP(S) article address permitted by the native source URL policy, falling back to its displayable origin when necessary. Existing site-only receipts retain their origin. Desktop may open an exact result URL after user activation and independent native history authorization."
          }
        }
      },
      "NativeMcpDisplay": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "resultKind",
          "texts",
          "diagnostics"
        ],
        "description": "Display-only native MCP facts. No raw arguments/error/meta/resources/structuredContent and no business field parsing. Native list_mcp_resources/list_mcp_resource_templates may expose a validated resource count and redacted resource names/titles, never resource URIs, cursors or metadata. Empty resource lists are successful real results, not omitted content. For yijie_web/kimi_web_search_pro only, Host validates the closed built-in web result and projects the ordered source summaries from its native text block. Raw page content and chunks are excluded. For yijie_web/kimi_web_fetch, observed results may expose only the requested hostname, a safe page title and a short full/partial reading outcome or fixed public error. The full URL and page body remain outside the display. Other tools retain their existing display policies. Limits do not change execution status; partial content availability must not suppress a known execution outcome. Host bounds total UTF-8 text at 256KiB and first 32 original content entries. Confidentiality may replace entire lines.",
        "properties": {
          "server": {
            "type": "string",
            "maxLength": 64,
            "pattern": "^[A-Za-z0-9_-]+$"
          },
          "tool": {
            "type": "string",
            "maxLength": 128,
            "pattern": "^[A-Za-z0-9_-]+$"
          },
          "resultKind": {
            "type": "string",
            "enum": [
              "absent",
              "null",
              "empty",
              "text",
              "unsupported",
              "omitted"
            ]
          },
          "texts": {
            "type": "array",
            "maxItems": 32,
            "items": {
              "$ref": "#/components/schemas/NativeMcpText"
            }
          },
          "diagnostics": {
            "type": "array",
            "maxItems": 8,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "enum": [
                "identity_unavailable",
                "arguments_unavailable",
                "unsupported_content",
                "content_redacted",
                "content_truncated",
                "content_limit",
                "result_unavailable",
                "display_limit"
              ]
            }
          },
          "searchReceipt": {
            "$ref": "#/components/schemas/DeepSearchReceipt"
          }
        }
      },
      "NativeThreadStatusSnapshot": {
        "type": "object",
        "additionalProperties": false,
        "description": "Current thread/read(includeTurns=false) status only. This ephemeral observation has no history watermark and must not change saved Item or Turn facts, infer their completion, or be persisted as a history format.",
        "required": [
          "schema_version",
          "source",
          "thread_id",
          "status"
        ],
        "properties": {
          "schema_version": {
            "type": "integer",
            "enum": [
              2
            ],
            "x-enum-varnames": [
              "NativeThreadStatusSnapshotSchemaVersionN2"
            ]
          },
          "source": {
            "type": "string",
            "enum": [
              "runtime_read"
            ],
            "x-enum-varnames": [
              "NativeThreadStatusSnapshotSourceRuntimeRead"
            ]
          },
          "thread_id": {
            "type": "string",
            "maxLength": 512
          },
          "status": {
            "type": "string",
            "enum": [
              "notLoaded",
              "idle",
              "systemError",
              "active"
            ],
            "x-enum-varnames": [
              "NativeThreadStatusSnapshotStatusNotLoaded",
              "NativeThreadStatusSnapshotStatusIdle",
              "NativeThreadStatusSnapshotStatusSystemError",
              "NativeThreadStatusSnapshotStatusActive"
            ],
            "description": "Exact native thread.status.type. active remains active even when historical Turns appear completed; idle is not inferred from Turn status. notLoaded and systemError do not prove readiness or grant permission."
          }
        }
      },
      "NativeWebSearchDisplay": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "action",
          "queries"
        ],
        "description": "Safe display of the native WebSearchAction only. No execution or lifecycle inference. Queries/pattern are bounded and redacted; pageLabel is a hostname only, never an actionable URL. Optional sources are actual search hits, never inferred citations. Absence means no source metadata observed.",
        "properties": {
          "action": {
            "type": "string",
            "enum": [
              "search",
              "openPage",
              "findInPage",
              "other"
            ]
          },
          "queries": {
            "type": "array",
            "maxItems": 8,
            "items": {
              "type": "string",
              "maxLength": 1024
            }
          },
          "pageLabel": {
            "type": "string",
            "maxLength": 253
          },
          "pattern": {
            "type": "string",
            "maxLength": 1024
          },
          "sources": {
            "type": "array",
            "maxItems": 32,
            "items": {
              "$ref": "#/components/schemas/NativeWebSearchSourceDisplay"
            }
          }
        }
      },
      "NativeWebSearchSourceDisplay": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "url"
        ],
        "description": "Actual provider search hit. Inert text only; not a verified citation or executable link. URL must be safe HTTP(S), no credentials, bounded and redacted; unsafe entries are omitted with partial availability.",
        "properties": {
          "url": {
            "type": "string",
            "maxLength": 2048,
            "pattern": "^https?://"
          },
          "title": {
            "type": "string",
            "maxLength": 512
          }
        }
      },
      "NativeCommandActionDisplay": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "index",
          "kind"
        ],
        "properties": {
          "index": {
            "type": "integer",
            "minimum": 0,
            "maximum": 63
          },
          "kind": {
            "type": "string",
            "enum": [
              "read",
              "listFiles",
              "search",
              "unknown"
            ]
          },
          "label": {
            "type": "string",
            "maxLength": 512
          },
          "query": {
            "type": "string",
            "maxLength": 256
          }
        },
        "description": "Safe projection of the original native command action. Index identifies a display action under its parent Item, not an independent execution."
      },
      "NativeToolDisplay": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "provenance"
        ],
        "properties": {
          "provenance": {
            "type": "string",
            "enum": [
              "nativeAppContext",
              "registeredTool",
              "allowedTitle"
            ]
          },
          "sourceLabel": {
            "type": "string",
            "maxLength": 160
          },
          "title": {
            "type": "string",
            "maxLength": 160
          }
        },
        "description": "Safe display labels only. Never tool identity, authority, raw arguments or arbitrary metadata."
      },
      "DeepSearchReceipt": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "version": {
            "type": "integer",
            "minimum": 2,
            "maximum": 2
          },
          "operation_id": {
            "type": "string",
            "format": "uuid"
          },
          "relation": {
            "type": "string",
            "enum": [
              "first",
              "joined",
              "reused"
